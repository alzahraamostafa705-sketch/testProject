<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=width-device, initial-scale=1.0">
    <title>Contact us</title>
</head>

<body>
    <header>
        <nav>
            <a href="man.html">main bage</a> |
            <a href="abu.html">about us</a> |
            <a href="cont.html">contact us</a>
        </nav>
    </header>
    <main>
        <h1>Contact us</h1>
        <form action="#" method="post">
            <div>
                <label for="fn">full name</label>
                <input type="text" id="fn" name="fullname" required>
            </div>
            <div>
                <label for="email">the email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="phone">phone number</label>
                <input type="number" id="phone" name="phone" required>
            </div>
            <div>
                <label for="birthdate">birthdate</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>
            <div>
                <p>gender</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">female</label>
            </div>
            <div>
                <p>interesting</p>
                <input type="checkbox" id="coding" name="interesting" value="coding">
                <label for="coding">coding</label>

                <input type="checkbox" id="design" name="interesting" value="design">
                <label for="design">design</label>
            </div>
            <div>
                <label for="subject">reson for contact</label>
                <select name="subject" id="subject">
                    <option value="general">general</option>
                    <option value="support">support</option>
                </select>
            </div>
            <br>
            <div>
                <label for="message">the message</label>
                <textarea id="message" name="message" rows="4" cols="30" placeholder="write ...."></textarea>
        </div>
        <br>
        <div>
            <button type="submit">submit</button>
        </div>
       </form>
        </main>
        <footer>
        <p>&copy;جميع الحقوق محفوظة 2026</p>
        </footer>

    </body>
</html>
